<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css.css">
    <title>Login</title>
  </head>
  <body id="boxbox">
    <div> <!-- Wichtig für alignment; Sonst erscheinen Elemente seitlich nebeneinander anstelle von untereinander -->
      <h1>Startscreen Formular</h1>
      <form id="loginform">
        <label for="username">Wie heißt du?</label>
        <input id="username" max="20" placeholder="Albert Einstein" type="text" />
        <p>Was möchtest du Spielen</p>

        <section id="buttons">
          <button>Üben</button>
          <button>Mathe Millionär</button>
          <button onclick="location.href = 'menu.html'">Weiter</button>
        </section>
      </form>
    </div>
  </body>
</html>
