<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/zehneruebergang.css">
    <link rel="stylesheet" href="../css/zehneruebergangMobile.css">
    <title>Zehnerübergang</title>
</head>
<body class="standard">
<script type="module" src="../js/highscore.js"></script>
<script type="module" src="../js/zehneruebergang.js"></script>

<a href="main.html">
    <button id="menu-button">Menü</button>
</a>

<div id="zehneruebergang">
    <div id="gameScreen">
        <section id="task">
            <div id="leftOperand"></div>
            <div id="operation"></div>
            <div id="rightOperand"></div>
            <div id="relation"></div>
            <div id="result"></div>
        </section>
        <section id="input">
            <label for="userInput" class="always-hidden">
                Ergebnis eingeben
            </label>
            <input type="number"
                   id="userInput"
                   name="age"
                   min="0"
                   max="99"
                   step="1"
                   placeholder="0-99"
                   required
                   autofocus>
            <button id="subtn" aria-label="Ergebnis prüfen">Prüfen</button>
            <button id="skipbtn" aria-label="Ergebnis prüfen">Überspringen</button>
        </section>
        <p class="hidden" id="helpcorrectfield"></p>
    </div>
    <div id="gameOverScreen" class="hidden">
        <h1>Game Over</h1>

        <div class="gameover-buttons">
            <a href="main.html">
                <button>Beenden</button>
            </a>

            <button id="restart">Noch einmal!</button>
        </div>
    </div>
</div>
<div id="timer"></div>
</body>
</html>
