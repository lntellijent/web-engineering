<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="../css/millionare.css" />
        <title>Mathe Millionär</title>

    </head>
    <body>
        <div class="hidden" id="gameoverScreen">
            <h1>Game Over</h1>

            <div class="gameover-buttons">
                <a href="main.html">
                    <button>Beenden</button>
                </a>

                <button onclick="startGame()">Noch einmal!</button>
            </div>
        </div>

        <nav>
            <a href="main.html">Home</a>
            <a href="highscore.html">Highscores</a>
            <a href="millionare.html">Mathe-Millionär</a>
            <a href="practice.html">Üben</a>
        </nav>
        <hr />
        
        <h1>Wer wird Mathe-Millionär</h1>

        <div class="game-layout">

            <div class="left-panel">
                <button onclick="jokerFifty()">50 : 50</button>
                <button>Publikum</button>
                <button onclick="jokerCall()">Telefon</button>
            </div>

            <div class="middle-panel">
                <div id="timer"></div>
            </div>

            <div class="right-panel">
                <p>Du hast gerade</p>
                <div id="moneyfield"></div>
            </div>
        </div>

     
        <div id="frage"></div>
        <div class="awnserboxes">
            <div id="awnserbox1" class="awnserbox" onclick="checkButton1()"></div>
            <div id="awnserbox2" class="awnserbox" onclick="checkButton2()"></div>
            <div id="awnserbox3" class="awnserbox" onclick="checkButton3()"></div>
            <div id="awnserbox4" class="awnserbox" onclick="checkButton4()"></div>
        </div>


        <script src="../js/millionaire.js"></script>
    </body>
</html>
