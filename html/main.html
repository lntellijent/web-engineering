<h1>Wer wird Mathemann?</h1>

<div id="nameinput">
    <form id="loginform">
        <label for="username">Wie heißt du?</label>
        <input id="username"
               type="text"
               maxlength="20"
               placeholder="Albert Einstein">
        <p id="showError"></p>
        <button type="button" id="startButton">Bestätigen</button>
    </form>
</div>

<div id="gameselection">
    <h2 id="welcomeText"></h2>
    <p>Wähle deinen Spielmodus:</p>

    <section id="gameSelectorButtons">
        <button type="button" id="millionareButton">Mathe Millionär</button>
        <button type="button" id="zehneruebergangButton">Zehnerübergang</button>
        <button type="button" id="highscoreButton">Highscore</button>
    </section>
</div>
