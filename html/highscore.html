<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/highscore.css" />
    <title>Highscores</title>
</head>

  <body>
    <a href="main.html" class="menu-button">
            Menü
    </a>
    
    <h1>Hier stehen die Besten</h1>
    
    <div id="twoScoreboards">
      <div class="boxbox">
        <h2>Zehnerübergang</h2>

        <table id="scoresZehnerübergang">
          <tr>
            <th>Platz</th>
            <th>Spieler</th>
            <th>Zeit</th>
            <th>Datum</th>
          </tr>
        </table>

      </div>

      <div class="boxbox">
        <h2>Mathe Millionär</h2>

        <table id="millionaerTable">
            <tr>
                <th>Platz</th>
                <th>Spieler</th>
                <th>Geld</th>
                <th>Datum</th>
            </tr>
        </table>

      </div>
    </div>


      
    <script src="../js/highscore.js"></script>

  </body>
</html>
